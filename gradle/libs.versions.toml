[versions]
foojay = "1.0.0"
google-java-format = "1.36.1"
junit = "6.1.3"
ktfmt = "0.65"
loom = "1.18.4"
moddev = "2.0.148"
rumdl = "0.2.79"
spotless = "8.10.4"
tomlj = "2.2.0"

[libraries]
jsr305 = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
mixin-processor = { module = "org.spongepowered:mixin", version = "0.8.5" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
guava = { module = "com.google.guava:guava", version = "31.1-jre" }
joml = { module = "org.joml:joml", version = "1.10.5" }
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.1" }
foojay-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
moddev-plugin = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
